<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vigil MDR{% endblock %}</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header>
    {% if request.session.get("user") %}
    <nav>
      <a href="/">Incidents</a>
      <a href="/metrics">Dashboard</a>
      <a href="/report" target="_blank">HTML report</a>
      <a href="/report.pdf">PDF report</a>
      <form method="post" action="/logout"><button type="submit" class="nav-button">Sign out</button></form>
    </nav>
    {% endif %}
    <a class="brand" href="/"><img src="/static/logo.svg" alt="" width="44" height="44">Vigil MDR</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
